openapi: 3.0.3
info:
  title: AnthoLume web API
  version: 1.0.0
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /api/v1/session:
    get:
      operationId: getSession
      security: []
      responses:
        '200':
          description: Current or anonymous session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      security: []
      responses:
        '200':
          description: Public deployment capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/session/login:
    post:
      operationId: login
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      security: []
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/session/register:
    post:
      operationId: register
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      security: []
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '201':
          description: Registered session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/session/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Rotated anonymous session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/documents:
    get:
      operationId: listDocuments
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
        - {name: q, in: query, schema: {type: string, maxLength: 256}}
        - {name: sort, in: query, schema: {type: string, enum: [title, author, added, read]}}
        - {name: resumable, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Shared library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: uploadDocument
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/epub+zip:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: The existing or newly uploaded shared book
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/documents/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDocument
      responses:
        '200':
          description: Live document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: editDocument
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentEdit'}
      responses:
        '200':
          description: Saved book
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteDocument
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Book removed from the shared library}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/metadata/search:
    get:
      operationId: lookupMetadata
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 240}}
      responses:
        '200':
          description: Suggested metadata, not saved
          content:
            application/json:
              schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/MetadataMatch'}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/metadata/match:
    get:
      operationId: previewMetadataMatch
      parameters:
        - {name: work_id, in: query, required: true, schema: {type: string, pattern: '^OL[0-9]{1,15}W$'}}
        - {name: edition_id, in: query, schema: {type: string, pattern: '^OL[0-9]{1,15}M$'}}
        - {name: isbn, in: query, schema: {type: string, pattern: '^([0-9]{13}|[0-9]{9}[0-9X])$'}}
      responses:
        '200':
          description: Verified Work and optional Edition preview, not saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetadataMatch'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/metadata/covers/{cover_id}:
    get:
      operationId: getMetadataCover
      parameters:
        - {name: cover_id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1, maximum: 9999999999}}
      responses:
        '200':
          description: Open Library cover preview
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/documents/{id}/cover:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDocumentCover
      responses:
        '200':
          description: Existing cover bytes; no metadata lookup
          content:
            image/*:
              schema: {type: string, format: binary}
        '206':
          description: Requested range of existing cover bytes
          content:
            image/*:
              schema: {type: string, format: binary}
        '304': {description: Not modified}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/documents/{id}/file:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: downloadDocument
      responses:
        '200':
          description: Original file; private no-store with safe attachment filename
          content:
            '*/*':
              schema: {type: string, format: binary}
        '206':
          description: Requested range of original file
          content:
            '*/*':
              schema: {type: string, format: binary}
        '304': {description: Not modified}
        '416': {description: Unsatisfiable range}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/preferences:
    patch:
      operationId: updatePreferences
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdate'}
      responses:
        '200':
          description: Saved account settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/password:
    post:
      operationId: changePassword
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200':
          description: Saved account settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/devices/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateDevicePreferences
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevicePreferences'}
      responses:
        '200':
          description: Saved account settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedDevice'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/devices:
    get:
      operationId: listManagedDevices
      responses:
        '200':
          description: Owned reading devices
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ManagedDevice'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerDevice
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Device'}
      responses:
        '200':
          description: Owned device
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/reading-state/{document_id}:
    get:
      operationId: getReadingState
      parameters:
        - name: document_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Authoritative reading head
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadingState'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/reading-progress:
    post:
      operationId: submitProgress
      description: Requires X-AnthoLume-Reading-Generation matching the generation captured when the event was queued. A missing or stale generation returns 409.
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgressEvent'}
      responses:
        '200':
          description: Immutable original receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/activity:
    post:
      operationId: submitActivity
      description: Requires X-AnthoLume-Reading-Generation matching the generation captured when the event was queued. A missing or stale generation returns 409.
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityEvent'}
      responses:
        '200':
          description: Immutable original receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/insights:
    get:
      operationId: getInsights
      responses:
        '200':
          description: Current reading records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Insights'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/insights/activity:
    get:
      operationId: listInsightActivity
      parameters:
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 1024}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000}}
        - {name: document, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: day, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Current reading records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsightActivityPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/insights/progress:
    get:
      operationId: listInsightProgress
      parameters:
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 1024}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000}}
      responses:
        '200':
          description: Current reading records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsightProgressPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/insights/rankings:
    get:
      operationId: listInsightRankings
      parameters:
        - name: period
          in: query
          description: 'Rolling window through now: week is 7 days, month is 30 days, year is 365 days.'
          schema: {type: string, enum: [week, month, year, all], default: all}
        - {name: metric, in: query, schema: {type: string, enum: [time, words, pace]}}
      responses:
        '200':
          description: Current reading records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InsightRankings'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - {in: query, name: after, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Users in ID order
          content:
            application/json:
              schema: {type: array, maxItems: 51, items: {$ref: '#/components/schemas/AdminUser'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAdminUser
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserCreate'}
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateAdminUser
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserUpdate'}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteAdminUser
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Account deleted after a verified database snapshot}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/jobs:
    get:
      operationId: listAdminJobs
      parameters:
        - {in: query, name: kind, schema: {type: string, enum: [statistics, database_check, backup, full_backup, import]}}
      responses:
        '200':
          description: Recent maintenance jobs
          content:
            application/json:
              schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AdminJob'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: startAdminJob
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {type: string, enum: [statistics, database_check, backup, full_backup, import]}
                reference: {type: boolean}
                relink_missing: {type: boolean}
                root_id: {$ref: '#/components/schemas/StorageRootID'}
      responses:
        '202':
          description: Started or currently running job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminJob'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/backup:
    get:
      operationId: downloadAdminBackup
      parameters:
        - {in: query, name: full, schema: {type: boolean, default: false}}
        - {in: query, name: account, description: Expected browser account, schema: {type: string}}
        - {in: query, name: generation, description: Expected browser reading generation, schema: {type: string}}
      responses:
        '200':
          description: Latest verified database snapshot or full library archive
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/backup/preview:
    get:
      operationId: previewAdminBackup
      responses:
        '200':
          description: Estimated files and bytes in the managed library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupPreview'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/restore:
    post:
      operationId: stageAdminRestore
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Validated restore candidate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRestore'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: applyAdminRestore
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRestoreApply'}
      responses:
        '204': {description: Database replaced and sessions invalidated}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/logs:
    get:
      operationId: listAdminLogs
      parameters:
        - {in: query, name: cursor, schema: {type: string, maxLength: 128}}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: level, schema: {$ref: '#/components/schemas/AdminLogLevel'}}
      responses:
        '200':
          description: Page of retained server logs, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLogPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/storage-roots:
    get:
      operationId: listAdminStorageRoots
      responses:
        '200':
          description: Configured storage roots
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminStorageRoot'}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveAdminStorageRoot
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminStorageRootInput'}
      responses:
        '204': {description: Storage root saved}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/storage-roots/make-library:
    get:
      operationId: previewMakeLibrary
      parameters:
        - {in: query, name: id, required: true, schema: {$ref: '#/components/schemas/StorageRootID'}}
        - {in: query, name: path, schema: {type: string, minLength: 1, maxLength: 4096}}
      responses:
        '200':
          description: Proposed Library change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MakeLibraryPlan'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: makeLibrary
      parameters: [{$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MakeLibraryPlan'}
      responses:
        '204': {description: Library changed}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/storage-directories:
    get:
      operationId: browseAdminStorageDirectories
      parameters:
        - {in: query, name: path, schema: {type: string, maxLength: 4096}}
      responses:
        '200':
          description: Directories visible to the server process
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminStorageDirectories'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/auto-import:
    get:
      operationId: listAdminAutoImports
      responses:
        '200':
          description: Configured automatic import rules
          content:
            application/json:
              schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AdminAutoImport'}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: saveAdminAutoImport
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {in: query, name: id, schema: {$ref: '#/components/schemas/AutoImportID'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAutoImportSettings'}
      responses:
        '204': {description: Automatic import rule saved}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: queueAdminAutoImport
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {in: query, name: id, required: true, schema: {$ref: '#/components/schemas/AutoImportID'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '204': {description: Scan queued}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteAdminAutoImport
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {in: query, name: id, required: true, schema: {$ref: '#/components/schemas/AutoImportID'}}
      responses:
        '204': {description: Rule deleted}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/import:
    get:
      operationId: previewAdminImport
      parameters:
        - {in: query, name: root_id, schema: {$ref: '#/components/schemas/StorageRootID'}}
      responses:
        '200':
          description: EPUB files in an import folder
          content:
            application/json:
              schema: {type: array, maxItems: 1000, items: {type: string}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/import/results:
    get:
      operationId: listAdminImportResults
      parameters:
        - {in: query, name: job, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: Per-file import results
          content:
            application/json:
              schema: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AdminImportResult'}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/system:
    get:
      operationId: getAdminSystem
      responses:
        '200':
          description: Server version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSystem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: token}
  parameters:
    Origin:
      name: Origin
      in: header
      description: Browser-provided, server-required exact PUBLIC_ORIGIN; never inferred from request Host
      schema: {type: string, minLength: 1, maxLength: 2048}
    CSRF:
      name: X-CSRF-Token
      in: header
      description: Server-required random session-bound token, supplied by client middleware; rotates on authentication changes
      schema: {type: string, minLength: 32, maxLength: 128}
    ID:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credentials'}
  responses:
    Problem:
      description: Safe machine-readable error
      headers:
        Retry-After: {schema: {type: string}, description: Present for temporary unavailability}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, is_admin]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        is_admin: {type: boolean}
    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [username, password, is_admin]
      properties:
        username: {$ref: '#/components/schemas/ID'}
        password: {type: string, minLength: 1, maxLength: 256}
        is_admin: {type: boolean}
    AdminUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        password: {type: string, minLength: 1, maxLength: 256}
        is_admin: {type: boolean}
    AdminJob:
      type: object
      additionalProperties: false
