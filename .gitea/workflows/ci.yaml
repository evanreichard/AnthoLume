name: CI
on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

env:
  FULL_CHECKS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}

jobs:
  go:
    name: Go qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: |
            go.sum
            api/audit.sh

      - name: Go tests
        run: go test -mod=readonly -count=1 -timeout=180s ./...

      - name: Go race tests
        if: env.FULL_CHECKS == 'true'
        run: go test -mod=readonly -race -count=1 -timeout=20m ./...

      - name: Go vet
        run: go vet -mod=readonly ./...

      - name: Verify modules
        run: go mod verify

      - name: Vulnerability audit
        run: bash api/audit.sh

  tests:
    name: Frontend and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          # The browser server and generator do not build the race dependencies; keep their cache separate.
          cache-dependency-path: |
            go.sum
            api/generate.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend and generation
        run: make check_web check_generation

      - name: Frontend lint and formatting
        run: |
          npm --prefix web run lint
          npm --prefix web run format:check

      - name: Build server with frontend assets
        run: go build -mod=readonly -o /dev/null .

      - name: Frontend unit tests
        run: npm --prefix web test

      - name: Install headless Chromium
        run: web/node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Browser tests
        id: browser
        run: |
          if [ "$FULL_CHECKS" = true ]; then
            npm --prefix web run test:browser
            npm --prefix web run test:reader
          else
            npm --prefix web run test:smoke
          fi

      - name: Save browser failure diagnostics
        if: failure() && steps.browser.outcome == 'failure'
        uses: christopherhx/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4, compatible with act_runner 0.2
        with:
          name: browser-failures
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/test-results/app/**/*.log
            build/test-results/*/**/error-context.md
            build/test-results/*/**/trace.zip

  publish:
    needs: [go, tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: image
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
          else
            tag="dev"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["8.8.8.8"]

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.va.reichard.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.image.outputs.tag }}
          tags: gitea.va.reichard.io/evan/antholume:${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=gitea.va.reichard.io/evan/antholume:dev
          cache-to: type=inline
