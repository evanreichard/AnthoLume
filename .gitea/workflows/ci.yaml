name: CI
on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend and generation
        run: make check_web check_generation

      - name: Root qualification
        run: |
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=1 -timeout=10m ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -o _scratch/m3/backend/antholume .
          go mod verify
          bash api/audit.sh

      - name: App browser tests
        run: |
          web/node_modules/.bin/playwright install --with-deps chromium
          npm --prefix web test
          npm --prefix web run test:browser
          npm --prefix web run test:reader

  publish:
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tag="pr-$PR_NUMBER"
          elif [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
          else
            tag="dev"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["8.8.8.8"]

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.va.reichard.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.image.outputs.tag }}
          tags: gitea.va.reichard.io/evan/antholume:${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=gitea.va.reichard.io/evan/antholume:dev
          cache-to: type=inline
