name: Publish preview

on:
  issue_comment:
    types: [created]

# Gitea loads comment-triggered workflows from the default branch, so a pull request cannot change this build.
permissions:
  contents: read
  issues: write

env:
  IMAGE: gitea.va.reichard.io/evan/antholume

jobs:
  preview:
    if: github.event.comment.body == '/publish' && github.event.issue.pull_request != null && (github.event.repository.permissions.push == true || github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Read the pull request head
        id: pr
        env:
          NUMBER: ${{ github.event.issue.number }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: token $TOKEN" "$API/repos/$REPO/pulls/$NUMBER" -o pr.json
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          pull = json.load(open('pr.json'))
          assert pull['state'] == 'open', 'previews build only open pull requests'
          assert pull['head']['repo']['full_name'] == os.environ['REPO'], 'previews build only same-repository branches'
          sha = pull['head']['sha']
          print(f'sha={sha}')
          print(f'tag=pr-{pull["number"]}-{sha[:12]}')
          PY

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Verify the checked-out head
        env:
          EXPECTED: ${{ steps.pr.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["8.8.8.8"]

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.va.reichard.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.pr.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.pr.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:dev
          cache-to: type=inline

      - name: Comment the result
        if: always()
        env:
          NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.build.outcome }}
          TAG: ${{ steps.pr.outputs.tag }}
          SHA: ${{ steps.pr.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          API: ${{ github.api_url }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          env = os.environ
          run = f"{env['SERVER'].rstrip('/')}/{env['REPO']}/actions/runs/{env['RUN_ID']}"
          if env['OUTCOME'] == 'success' and env.get('SHA'):
              body = (f"Preview for `{env['SHA']}` is ready.\n\n"
                      f"```\ndocker pull {env['IMAGE']}:{env['TAG']}\n```\n\n"
                      f"Digest: `{env.get('DIGEST', '')}`\nRun: {run}\n")
          else:
              body = f"Preview build failed. See {run}\n"
          request = urllib.request.Request(
              f"{env['API']}/repos/{env['REPO']}/issues/{env['NUMBER']}/comments",
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={'Authorization': f"token {env['TOKEN']}", 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status, response.read()[:200])
          PY
